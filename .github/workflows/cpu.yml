name: CPU contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    env:
      TORCH_DEVICE_BACKEND_AUTOLOAD: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install 'setuptools>=68' wheel pytest 'aiohttp>=3.10,<4' 'numpy>=1.26,<3'
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python tools/check_release.py
      - run: bash tools/test_cpu.sh
      - run: python -m examples.reference_attention --ratio 4
